<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紫微斗數命盤</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#f7f6f2;--bg3:#f0ede6;
  --text:#1a1a1a;--text2:#555;--text3:#888;
  --border:#e0ddd6;--border2:#ccc;
  --accent:#7c4a2d;--accent2:#a86340;
  --gold:#b8860b;--jade:#1a7a4a;
  --red:#c0392b;--blue:#1a5276;
  --radius:8px;--shadow:0 2px 8px rgba(0,0,0,0.08);
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1814;--bg2:#22201c;--bg3:#2a2822;
    --text:#e8e0d0;--text2:#b0a890;--text3:#786858;
    --border:#3a3830;--border2:#4a4840;
    --accent:#d4845a;--accent2:#e8a070;
    --gold:#d4a020;--jade:#2aaa6a;
    --red:#e05040;--blue:#4a8ab8;
  }
}
body{font-family:'Noto Serif TC','Georgia',serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.6}
h1{font-size:22px;font-weight:600;color:var(--accent)}
h2{font-size:17px;font-weight:600;color:var(--accent);margin-bottom:8px}
h3{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}

/* Layout */
.app{max-width:1100px;margin:0 auto;padding:16px}
.header{text-align:center;padding:16px 0 12px;border-bottom:1px solid var(--border);margin-bottom:16px}
.header p{font-size:13px;color:var(--text3);margin-top:4px}

/* Input form */
.input-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.form-row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--text2);font-weight:500}
.field input,.field select{height:34px;padding:0 8px;border:1px solid var(--border2);border-radius:6px;background:var(--bg);color:var(--text);font-size:13px;font-family:inherit}
.field input[type=number]{width:70px}
.field select{padding-right:24px}
.btn{height:34px;padding:0 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:500}
.btn:hover{background:var(--accent2)}
.btn-sm{height:28px;padding:0 12px;font-size:12px}
.btn-outline{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn-outline:hover{background:var(--bg3)}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 14px;cursor:pointer;font-size:13px;color:var(--text3);border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;font-family:inherit}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* Palace grid */
.chart-wrap{overflow-x:auto;margin-bottom:16px}
.palace-grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,auto);gap:2px;min-width:560px}
.palace{background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:6px;min-height:130px;cursor:pointer;transition:border-color .15s}
.palace:hover{border-color:var(--accent)}
.palace.selected{border-color:var(--accent);border-width:2px;background:var(--bg3)}
.palace-center{grid-column:2/4;grid-row:2/4;background:var(--bg3);border:1px solid var(--border);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.palace-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid var(--border)}
.palace-name{font-size:12px;font-weight:600;color:var(--accent)}
.palace-branch{font-size:11px;color:var(--text3)}
.palace-stars{display:flex;flex-wrap:wrap;gap:2px}
.star{font-size:11px;padding:1px 3px;border-radius:3px;background:var(--bg3);color:var(--text2);line-height:1.4}
.star.main{background:rgba(124,74,45,0.12);color:var(--accent)}
.star.lu{color:var(--jade);font-weight:600}
.star.quan{color:var(--blue);font-weight:600}
.star.ke{color:var(--gold);font-weight:600}
.star.ji{color:var(--red);font-weight:600}
.star.sha{color:var(--red)}
.star.ji-star{color:var(--text3)}
.palace-limit{font-size:10px;color:var(--text3);margin-top:3px}
.palace-limit span{color:var(--accent);font-weight:500}

/* Center panel */
.center-title{font-size:16px;font-weight:700;color:var(--accent);letter-spacing:2px}
.center-info{font-size:11px;color:var(--text2);text-align:center;line-height:1.8}

/* Palace detail panel */
.detail-panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-top:12px}
.detail-title{font-size:15px;font-weight:700;color:var(--accent);margin-bottom:8px}
.detail-body{font-size:13px;color:var(--text);line-height:1.9}
.star-tag{display:inline-block;padding:2px 6px;background:rgba(124,74,45,0.1);border-radius:4px;font-weight:500;color:var(--accent);margin:0 2px}
.analysis-section{margin-top:10px;padding-top:8px;border-top:1px solid var(--border)}
.analysis-section h4{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px}

/* Limits & transits */
.limits-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-bottom:12px}
.limit-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px}
.limit-card.current{border-color:var(--accent);background:var(--bg3)}
.limit-card h4{font-size:12px;color:var(--text3);margin-bottom:4px}
.limit-card .lc-main{font-size:15px;font-weight:600;color:var(--accent)}
.limit-card .lc-stars{font-size:11px;color:var(--text2);margin-top:2px}
.limit-card .lc-age{font-size:11px;color:var(--text3)}

.transit-row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin-bottom:8px}
.transit-card{flex:1;min-width:130px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px}
.transit-card.highlight{border-color:var(--gold);background:rgba(184,134,11,0.06)}
.transit-card h4{font-size:11px;color:var(--text3);margin-bottom:4px}
.transit-card .tc-main{font-size:14px;font-weight:600;color:var(--text)}
.transit-card .tc-sub{font-size:11px;color:var(--text2);margin-top:2px}
/* Transit drill-down */
.tblock{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-top:10px}
.tblock-title{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tblock-title small{font-size:11px;font-weight:400;color:var(--text3)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:5px;margin-bottom:4px}
.tgrid-wide{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
.tcell{background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:5px 6px;cursor:pointer;font-size:11px;transition:border-color .12s}
.tcell:hover{border-color:var(--accent2)}
.tcell.sel{border:2px solid var(--accent);background:var(--bg)}
.tcell .tl{font-size:10px;color:var(--text3);margin-bottom:1px}
.tcell .tn{font-weight:600;color:var(--accent);font-size:11px}
.tcell .ts{font-size:10px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcell.empty-gong{opacity:0.75;background:var(--bg2)}

/* Compatibility */
.compat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.compat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.compat-card h3{color:var(--accent);margin-bottom:8px}
.compat-result{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-top:12px}
.compat-score{font-size:36px;font-weight:700;color:var(--accent);text-align:center;padding:8px}
.compat-score span{font-size:14px;font-weight:400;color:var(--text3)}

/* Misc */
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:11px}
.badge-gold{background:rgba(184,134,11,0.15);color:var(--gold)}
.badge-jade{background:rgba(26,122,74,0.12);color:var(--jade)}
.badge-red{background:rgba(192,57,43,0.12);color:var(--red)}
.divider{border:none;border-top:1px solid var(--border);margin:12px 0}
.note{font-size:11px;color:var(--text3);font-style:italic}
.row-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;background:var(--bg3);color:var(--text2);margin:1px}
.hidden{display:none}
</style>
</head>
<body>
<div class="app">
<div class="header">
  <h1>紫微斗數命盤</h1>
  <p>輸入出生年月日時，自動排盤並提供十二宮、大限、流年等完整論述</p>
</div>

<!-- Input -->
<div class="input-card">
  <div class="form-row">
    <div class="field">
      <label>日曆類型</label>
      <select id="calType">
        <option value="solar">國曆（公曆）</option>
        <option value="lunar">農曆</option>
      </select>
    </div>
    <div class="field">
      <label>年</label>
      <input type="number" id="birthYear" value="1990" min="1900" max="2100">
    </div>
    <div class="field">
      <label>月</label>
      <input type="number" id="birthMonth" value="5" min="1" max="12">
    </div>
    <div class="field">
      <label>日</label>
      <input type="number" id="birthDay" value="15" min="1" max="31">
    </div>
    <div class="field" id="leapField" style="display:none">
      <label>閏月</label>
      <select id="isLeap">
        <option value="0">否</option>
        <option value="1">是</option>
      </select>
    </div>
    <div class="field">
      <label>時辰</label>
      <select id="birthHour">
        <option value="0">日子時 (23:00–00:00) 當日</option>
        <option value="0n">夜子時 (00:00–01:00) 翌日</option>
        <option value="1">丑時 (01:00–03:00)</option>
        <option value="2">寅時 (03:00–05:00)</option>
        <option value="3">卯時 (05:00–07:00)</option>
        <option value="4">辰時 (07:00–09:00)</option>
        <option value="5">巳時 (09:00–11:00)</option>
        <option value="6">午時 (11:00–13:00)</option>
        <option value="7">未時 (13:00–15:00)</option>
        <option value="8">申時 (15:00–17:00)</option>
        <option value="9">酉時 (17:00–19:00)</option>
        <option value="10">戌時 (19:00–21:00)</option>
        <option value="11">亥時 (21:00–23:00)</option>
      </select>
    </div>
    <div id="ziHint" style="display:none;font-size:11px;color:var(--accent2);align-self:flex-end;padding-bottom:6px">
      ⚠ 夜子時以輸入日期之翌日農曆日排盤
    </div>
    <div class="field">
      <label>性別</label>
      <select id="gender">
        <option value="m">男</option>
        <option value="f">女</option>
      </select>
    </div>
    <button class="btn" onclick="buildChart()">排命盤</button>
  </div>

  <!-- Time / Timezone / DST helper row -->
  <details style="margin-top:4px">
    <summary style="font-size:12px;color:var(--text2);cursor:pointer;user-select:none;padding:4px 0">
      ▸ 時間與時區輔助（可選）—— 輸入實際時刻自動換算時辰
    </summary>
    <div class="form-row" style="margin-top:10px;margin-bottom:4px">
      <div class="field">
        <label>出生時刻（24h）</label>
        <input type="time" id="birthTime" style="width:110px" oninput="updateHourFromTime()">
      </div>
      <div class="field">
        <label>出生地時區</label>
        <select id="tzOffset" onchange="updateHourFromTime()" style="min-width:220px">
          <option value="8">UTC+8 台灣／中國／香港／新加坡</option>
          <option value="9">UTC+9 日本／韓國</option>
          <option value="7">UTC+7 泰國／越南／印尼西部</option>
          <option value="5.5">UTC+5:30 印度</option>
          <option value="3">UTC+3 莫斯科／東歐夏令</option>
          <option value="1">UTC+1 中歐標準時間 (CET)</option>
          <option value="0">UTC+0 英國冬令 / 格林威治</option>
          <option value="-3">UTC-3 巴西東部</option>
          <option value="-4">UTC-4 美國東部夏令 (EDT)</option>
          <option value="-5">UTC-5 美國東部標準 (EST)</option>
          <option value="-6">UTC-6 美國中部標準 (CST)</option>
          <option value="-7">UTC-7 美國山地標準 (MST)</option>
          <option value="-8">UTC-8 美國太平洋標準 (PST)</option>
          <option value="-9">UTC-9 美國阿拉斯加標準</option>
          <option value="-10">UTC-10 夏威夷</option>
          <option value="10">UTC+10 澳洲東部標準 (AEST)</option>
          <option value="11">UTC+11 澳洲東部夏令 (AEDT)</option>
          <option value="12">UTC+12 紐西蘭標準</option>
        </select>
      </div>
      <div class="field" style="justify-content:flex-end">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer;height:34px">
          <input type="checkbox" id="dstOn" onchange="updateHourFromTime()" style="width:14px;height:14px">
          <span>日光節約（夏令）<br><small style="color:var(--text3)">時鐘+1h，需減回</small></span>
        </label>
      </div>
      <div class="field">
        <label>換算結果</label>
        <div id="timeAdjusted" style="height:34px;line-height:34px;font-size:12px;color:var(--jade);min-width:160px">— 請輸入時刻 —</div>
      </div>
    </div>
    <div style="font-size:11px;color:var(--text3);padding-bottom:6px;line-height:1.7">
      ※ 紫微斗數以<strong>出生地當地標準時間</strong>（非台灣時間）判斷時辰，日光節約時間須扣除 1 小時還原成標準時。<br>
      ※ 換算後會自動更新上方「時辰」欄位，可手動微調。
    </div>
  </details>

  <div id="lunarDisplay" style="font-size:12px;color:var(--text3);margin-top:6px"></div>
</div>

<!-- Tabs -->
<div id="resultArea" class="hidden">
<div class="tabs">
  <div class="tab active" onclick="showTab('chart')">命盤總覽</div>
  <div class="tab" onclick="showTab('palaces')">十二宮解析</div>
  <div class="tab" onclick="showTab('limits')">大限・小限</div>
  <div class="tab" onclick="showTab('transits')">流年・流月・流日</div>
  <div class="tab" onclick="showTab('compat')">合盤</div>
</div>

<!-- Tab: Chart -->
<div id="tab-chart" class="tab-panel active">
  <div id="chartInfoBar" style="font-size:13px;color:var(--text2);margin-bottom:10px;line-height:1.9"></div>
  <div class="chart-wrap">
    <div class="palace-grid" id="palaceGrid"></div>
  </div>
  <div id="palaceDetail"></div>
</div>

<!-- Tab: Palaces -->
<div id="tab-palaces" class="tab-panel">
  <div id="palacesDetail"></div>
</div>

<!-- Tab: Limits -->
<div id="tab-limits" class="tab-panel">
  <div id="limitsContent"></div>
</div>

<!-- Tab: Transits -->
<div id="tab-transits" class="tab-panel">
  <div class="form-row" style="margin-bottom:4px;flex-wrap:wrap;gap:8px;align-items:flex-end">
    <div class="field">
      <label>日期類型</label>
      <select id="qCalType" onchange="onQCalChange()" style="width:90px">
        <option value="solar">國曆</option>
        <option value="lunar">農曆</option>
      </select>
    </div>
    <div class="field">
      <label>年</label>
      <input type="number" id="queryYear" value="2026" min="1950" max="2100" style="width:78px" oninput="updateQDisplay()">
    </div>
    <div class="field">
      <label>月</label>
      <input type="number" id="queryMonth" value="6" min="1" max="12" style="width:56px" oninput="updateQDisplay()">
    </div>
    <div class="field">
      <label id="qDayLabel">日</label>
      <input type="number" id="queryDay" value="15" min="1" max="31" style="width:56px" oninput="updateQDisplay()">
    </div>
    <div class="field" id="qLeapWrap" style="display:none">
      <label>閏月</label>
      <select id="queryLeap" style="width:54px"><option value="0">否</option><option value="1">是</option></select>
    </div>
    <button class="btn btn-sm" onclick="buildTransits()">查詢運勢</button>
  </div>
  <div id="qDisplay" style="font-size:12px;color:var(--text3);margin-bottom:10px;min-height:16px"></div>
  <div id="transitsContent"></div>
</div>

<!-- Tab: Compat -->
<div id="tab-compat" class="tab-panel">
  <div class="compat-grid">
    <div class="compat-card">
      <h3>本命（已排盤）</h3>
      <div id="compatSelf" style="font-size:13px;color:var(--text2)">請先排命盤</div>
    </div>
    <div class="compat-card">
      <h3>對方生辰</h3>
      <div class="form-row" style="flex-direction:column;gap:8px">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <div class="field">
            <label>年</label>
            <input type="number" id="c2Year" value="1992" min="1900" max="2100">
          </div>
          <div class="field">
            <label>月</label>
            <input type="number" id="c2Month" value="8" min="1" max="12">
          </div>
          <div class="field">
            <label>日</label>
            <input type="number" id="c2Day" value="20" min="1" max="31">
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <div class="field">
            <label>時辰</label>
            <select id="c2Hour">
              <option value="0">子</option><option value="1">丑</option><option value="2">寅</option>
              <option value="3">卯</option><option value="4">辰</option><option value="5">巳</option>
              <option value="6">午</option><option value="7">未</option><option value="8">申</option>
              <option value="9">酉</option><option value="10">戌</option><option value="11">亥</option>
            </select>
          </div>
          <div class="field">
            <label>性別</label>
            <select id="c2Gender">
              <option value="m">男</option>
              <option value="f">女</option>
            </select>
          </div>
        </div>
        <button class="btn btn-sm" onclick="buildCompat()">分析合盤</button>
      </div>
    </div>
  </div>

  <!-- Palace compatibility selector -->
  <div style="background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:12px">
    <h3 style="margin-bottom:8px">選擇評論宮位（可複選）</h3>
    <div id="compatPalaceSelect" style="display:flex;flex-wrap:wrap;gap:6px"></div>
  </div>

  <div id="compatResult"></div>
</div>
</div><!-- end resultArea -->

<script>
// ==================== LUNAR CALENDAR ====================
const lunarInfo=[0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,

function leapMonth(y){return lunarInfo[y-1900]&0xf}
function leapDays(y){if(leapMonth(y))return(lunarInfo[y-1900]&0x10000)?30:29;return 0}
function monthDays(y,m){return(lunarInfo[y-1900]&(0x10000>>m))?30:29}
function yearDays(y){let s=348;for(let i=0x8000;i>0x8;i>>=1)s+=(lunarInfo[y-1900]&i)?1:0;return s+leapDays(y)}

function solarToLunar(sy,sm,sd){
  // offset = days elapsed since 1900-01-31 (= 農曆 1900/1/1, day 0)
  const base=Math.round((Date.UTC(sy,sm-1,sd)-Date.UTC(1900,0,31))/86400000);
  if(base<0)return null;
  let offset=base, ly=1900;
  // Find lunar year
  while(ly<2100){const yd=yearDays(ly);if(offset<yd)break;offset-=yd;ly++;}
  // Find lunar month: iterate regular month then its leap month (if any)
  const leap=leapMonth(ly);
  let lm=1,isLeap=false;
  for(let m=1;m<=12;m++){
    const md=monthDays(ly,m);
    if(offset<md){lm=m;isLeap=false;break;}
    offset-=md;
    if(leap===m){
      const ld2=leapDays(ly);
      if(offset<ld2){lm=m;isLeap=true;break;}
      offset-=ld2;
    }
    if(m===12){lm=12;isLeap=false;} // safety
  }
  return{y:ly,m:lm,d:offset+1,isLeap};
}

function calcChengGu(yearStem,yearBranch,lunarMonth,lunarDay,hourBranch){
  // lunarMonth is 1-based (正月=1), lunarDay is 1-based (初一=1)
  let idx60=0;
  for(let i=0;i<60;i++){if(i%10===yearStem&&i%12===yearBranch){idx60=i;break;}}
  const yw=CHENGGU_YEAR[idx60]||12;
  const mw=CHENGGU_MONTH[lunarMonth-1]||8;  // convert to 0-based
  const dw=CHENGGU_DAY[Math.min(lunarDay-1,29)]||8;
  const hw=CHENGGU_HOUR[hourBranch]||8;
  const total=yw+mw+dw+hw;
  return{liang:Math.floor(total/10),qian:total%10,total,yw,mw,dw,hw};
}

// ==================== CORE CALCULATIONS ====================
function getYearGanZhi(year){
  const g=(year-4)%10; const z=(year-4)%12;
  return{stem:(g+10)%10, branch:(z+12)%12}
}

function getLifePalace(lunarMonth, hourBranch){
  // 寅起正月，順數至生月，逆數生時為命宮
  // 順數至月: 位置=(2+月-1)=(月+1); 逆數時辰: -時支
  return(lunarMonth+1-hourBranch+12)%12
}

function getBodyPalace(lunarMonth, hourBranch){
  // 寅起正月，順數至生月，順數生時為身宮
  return(lunarMonth+hourBranch+1)%12
}

function getJu(yearStem, lifePalace){
  // 五虎遁年: 寅月天干 by year stem
  const startStems=[2,4,6,8,0,2,4,6,8,0]; // 甲己→丙(2), 乙庚→戊(4)...
  const ss=startStems[yearStem];
  const palaceStem=(ss+(lifePalace-2+12)%12)%10;
  const palaceBranch=lifePalace;
  // Sexagenary index: i%10=palaceStem, i%12=palaceBranch
  const idx=(6*palaceStem-5*palaceBranch+120)%60;
  const nayin=NAYIN[Math.floor(idx/2)];
  return JU_MAP[nayin]||3;
}

function getZiWeiPos(day, ju){
  // 訣: 商數宮前走; 若見數無餘便起虎口(寅); 奇逆偶順
  const q=Math.ceil(day/ju);
  const r=q*ju-day;
  const base=(2+q-1)%12; // 從寅起，順數q宮 (寅=第1宮)
  if(r===0)return base;
  if(r%2===1)return(base-r+12)%12; // 奇數余: 逆回r宮
  return(base+r)%12;                // 偶數余: 順進r宮
}

function placeMainStars(zwPos){
  const s={};
  // 紫微系 — 訣: 紫微逆去天機星,隔一太陽武曲辰,連接天同空二宮,廉貞居處方是真
  // 逆=counterclockwise=branch-1; 隔一=skip1; 空二=skip2
  s['紫微']=zwPos;
  s['天機']=(zwPos-1+12)%12;          // 逆1
  // (zwPos-2) empty
  s['太陽']=(zwPos-3+12)%12;          // 隔一,逆3
  s['武曲']=(zwPos-4+12)%12;          // 逆4
  s['天同']=(zwPos-5+12)%12;          // 逆5
  // (zwPos-6), (zwPos-7) empty (空二宮)
  s['廉貞']=(zwPos-8+12)%12;          // 逆8
  // 天府系 — 訣: 天府順行有太陰,貪狼而後巨門臨,隨來天相天梁繼,七殺空三是破軍
  // 順=clockwise=branch+1; 空三=skip3
  const tfPos=(4-zwPos+12)%12;        // 天府對位公式驗證: 丑卯相更迭,未酉互為根…
  s['天府']=tfPos;
  s['太陰']=(tfPos+1)%12;
  s['貪狼']=(tfPos+2)%12;
  s['巨門']=(tfPos+3)%12;
  s['天相']=(tfPos+4)%12;
  s['天梁']=(tfPos+5)%12;
  s['七殺']=(tfPos+6)%12;
  // (tfPos+7),(tfPos+8),(tfPos+9) empty (空三)
  s['破軍']=(tfPos+10)%12;
  return s;
}

function placeAuxStars(yearStem, yearBranch, lunarMonth, hourBranch){
  const s={};
  // 文昌: 從戌(10)逆布，子時=戌
  s['文昌']=(10-hourBranch+12)%12;
  // 文曲: 從辰(4)順布，子時=辰
  s['文曲']=(4+hourBranch)%12;
  // 左輔: 從辰(4)起正月順布
  s['左輔']=(3+lunarMonth)%12;
  // 右弼: 從戌(10)起正月逆布
  s['右弼']=(11-lunarMonth+12)%12;
  // 天魁天鉞
  s['天魁']=TIANKUI[yearStem];
  s['天鉞']=TIANYUE[yearStem];
  // 祿存、擎羊、陀羅
  const lz=LUZUN[yearStem];
  s['祿存']=lz;
  s['擎羊']=(lz+1)%12;
  s['陀羅']=(lz-1+12)%12;
  // 火星/鈴星 — 訣: 申子辰人寅戌揚,寅午戌人丑卯方,巳酉丑人卯戌位,亥卯未人酉戌房
  // 以生年地支找出子時起點，再順數至生時
  // 火星: 申子辰→寅(2),寅午戌→丑(1),巳酉丑→卯(3),亥卯未→酉(9)
  // 鈴星: 申子辰→戌(10),寅午戌→卯(3),巳酉丑→戌(10),亥卯未→戌(10)
  const fireStart=[2,3,1,9,2,3,1,9,2,3,1,9]; // 子丑寅卯辰巳午未申酉戌亥
  const bellStart=[10,10,3,10,10,10,3,10,10,10,3,10];
  s['火星']=(fireStart[yearBranch]+hourBranch)%12;
  s['鈴星']=(bellStart[yearBranch]+hourBranch)%12;
  // 天空: 亥時生人在子，子時生人在亥，順數
  s['天空']=(11-hourBranch+12)%12;
  // 地劫: 亥宮起亥時，逆布
  s['地劫']=(11-hourBranch+12)%12===s['天空']?(10-hourBranch+12)%12:(10-hourBranch+12)%12;
  s['地劫']=(hourBranch+11)%12; // 地劫從亥順布
  s['天空']=(11-hourBranch+12)%12;
  return s;
}

function getSihua(yearStem, stars){
  const sh=SIHUA[yearStem];
  const result={};
  Object.entries(sh).forEach(([type,star])=>{
    if(stars[star]!==undefined){
      if(!result[stars[star]])result[stars[star]]=[];
      result[stars[star]].push({star,type});
    }
  });
  return result;
}

function buildChartData(ly, lm, ld, hourBranch, yearStem, yearBranch, gender, isLeapMonth){
  const lifePalace=getLifePalace(lm, hourBranch);
  const bodyPalace=getBodyPalace(lm, hourBranch);
  const ju=getJu(yearStem, lifePalace);
  const zwPos=getZiWeiPos(ld, ju);
  const mainStars=placeMainStars(zwPos);
  const auxStars=placeAuxStars(yearStem, yearBranch, lm, hourBranch);
  const allStars={...mainStars, ...auxStars};
  const sihuaMap=getSihua(yearStem, allStars);

  // Build palaces array — 訣: 由命宮逆數: 兄弟、夫妻、子女…父母
  // 逆數=counterclockwise=branch-1 per palace
  const palaces=Array.from({length:12},(_,i)=>{
    const branch=(lifePalace-i+12)%12;
    return{
      palaceIndex:i,
      palaceName:PALACE_NAMES[i],
      branch,
      branchChar:ZHI[branch],
      mainStars:[],
      auxStars:[],
      sihua:sihuaMap[branch]||[],
    };
  });

  // Map branch to palace
  const branchToPalace={};
  palaces.forEach(p=>branchToPalace[p.branch]=p);

  const MAIN_STAR_SET=new Set(['紫微','天機','太陽','武曲','天同','廉貞','天府','太陰','貪狼','巨門','天相','天梁','七殺','破軍']);
  Object.entries(allStars).forEach(([name,branch])=>{
    const palace=branchToPalace[branch];
    if(palace){
      if(MAIN_STAR_SET.has(name))palace.mainStars.push(name);
      else palace.auxStars.push(name);
    }
  });

  // 大限
  const isYang=(yearStem%2===0);
  const isMale=(gender==='m');
  const forward=(isYang&&isMale)||(!isYang&&!isMale);
  const limits=buildDaXian(lifePalace, ju, forward, palaces);

  return{lifePalace, bodyPalace, ju, zwPos, palaces, limits, forward,
    yearStem, yearBranch, lm, ld, hourBranch, gender};
}

function buildDaXian(lifePalace, ju, forward, palaces){
  const limits=[];
  for(let i=0;i<12;i++){
    const startAge=ju+i*10;
    const endAge=ju+i*10+9;
    const dir=forward?1:-1;
    const branch=(lifePalace+dir*i+12*10)%12;
    const palace=palaces.find(p=>p.branch===branch);
    limits.push({
      n:i+1,
      startAge,endAge,
      branch,
      branchChar:ZHI[branch],
      palaceName:palace?palace.palaceName:'',
      mainStars:palace?palace.mainStars:[],
      auxStars:palace?palace.auxStars:[],
    });
  }
  return limits;
}

function getXiaoXian(yearBranch, gender, age){
  // 訣: 男順女逆; 寅午戍人辰上起,申子辰人自戍宮,巳酉丑人未宮始,亥卯未人起丑宮
  // 三合局分組: 寅午戌(2,6,10), 申子辰(8,0,4), 巳酉丑(5,9,1), 亥卯未(11,3,7)
  const mStarts=[10,7,4,1,10,7,4,1,10,7,4,1]; // 男起宮 by 年支索引(子=0…亥=11)
  const fStarts=[4,1,10,7,4,1,10,7,4,1,10,7]; // 女起宮
  const startPos=(gender==='m')?mStarts[yearBranch]:fStarts[yearBranch];
  // 男順(+1 clockwise=branch增), 女逆(-1 counterclockwise=branch減)
  const dir=(gender==='m')?1:-1;
  return(startPos+dir*(age-1)+120)%12;
}

function getLiuNianPos(yearBranch){
  // 流年命宮落在當年太歲地支所在宮 (命盤中地支=yearBranch的那個宮)
  // 直接回傳 yearBranch，外部再從 palaces 找 branch===yearBranch 的宮
  return yearBranch;
}

function getShichen(h, m){
  // Normalise to 0-23
  const hh=((h%24)+24)%24;
  if(hh===23)return{branch:0,isYeZi:false};   // 日子時 23:00-24:00
  if(hh===0) return{branch:0,isYeZi:true};    // 夜子時 00:00-01:00
  // 丑01-02, 寅03-04, 卯05-06, 辰07-08, 巳09-10, 午11-12
  // 未13-14, 申15-16, 酉17-18, 戌19-20, 亥21-22
  // branch: 丑=1,寅=2,...亥=11  (每兩小時一支，從 01:00 起為丑)
  return{branch:Math.floor((hh+1)/2),isYeZi:false};
}

  // DST correction: if summer time is on, clock is 1h ahead → subtract 1h to get local standard time
  const dst=document.getElementById('dstOn').checked;
  if(dst)h-=1;

  // Timezone: convert birth local standard time to local standard (no cross-tz conversion needed;
  // 時辰 is determined by birth LOCATION local standard time)
  // We just show the adjusted local standard time for user verification.
  const adjH=((h%24)+24)%24;
  const adjLabel=`${String(adjH).padStart(2,'0')}:${String(mn).padStart(2,'0')}`;

  const{branch,isYeZi}=getShichen(h,mn);
  const hourSelect=document.getElementById('birthHour');
  hourSelect.value=isYeZi?'0n':String(branch);
  document.getElementById('ziHint').style.display=isYeZi?'flex':'none';

  const shichenName=isYeZi?'夜子時':ZHI[branch]+'時';
  adjEl.textContent=`標準時 ${adjLabel}${dst?' (已扣夏令)':''} → ${shichenName}`;
  adjEl.style.color=dst?'var(--accent)':'var(--jade)';
}

// Lunar → Solar conversion (used for 夜子時 date advance and future reference)
// isLeap: true if the input month is the leap version of lm
function lunarToSolarApprox(ly,lm,ld,isLeap){
  let offset=0;
  for(let i=1900;i<ly;i++)offset+=yearDays(i);
  const leap=leapMonth(ly);
  // Add days for months before lm (regular + any leap in between)
  for(let m=1;m<lm;m++){
    offset+=monthDays(ly,m);
    if(leap===m)offset+=leapDays(ly);
  }
  // If birth is in the leap version of lm, skip regular lm first
  if(isLeap&&leap===lm)offset+=monthDays(ly,lm);
  offset+=ld-1; // day within the month (0-indexed offset)
  const base=new Date(Date.UTC(1900,0,31));
  const dt=new Date(base.getTime()+offset*86400000);
  return{y:dt.getUTCFullYear(),m:dt.getUTCMonth()+1,d:dt.getUTCDate()};
}

function buildChart(){
  const calType=document.getElementById('calType').value;
  let y=+document.getElementById('birthYear').value;
  let m=+document.getElementById('birthMonth').value;
  let d=+document.getElementById('birthDay').value;
  const hourRaw=document.getElementById('birthHour').value;
  const isYeZi=(hourRaw==='0n'); // 夜子時：需將農曆日進一天
  const h=isYeZi?0:+hourRaw;
  const gender=document.getElementById('gender').value;
  let ly,lm,ld,isLeap=false;

  if(calType==='solar'){
    // 夜子時：出生時刻在00:00–01:00，農曆日以「翌日」計算
    if(isYeZi){const next=new Date(y,m-1,d+1);y=next.getFullYear();m=next.getMonth()+1;d=next.getDate()}
    const l=solarToLunar(y,m,d);
    if(!l){alert('日期超出支援範圍');return}
    ly=l.y;lm=l.m;ld=l.d;isLeap=l.isLeap;
  }else{
    // 農曆直接輸入
    const lunarIsLeap=document.getElementById('isLeap').value==='1';
    if(isYeZi){
      // 夜子時：農曆日進一天（先轉太陽曆加一天再轉回）
      const tmpSolar=lunarToSolarApprox(y,m,d,lunarIsLeap);
      if(tmpSolar){
        const next=new Date(Date.UTC(tmpSolar.y,tmpSolar.m-1,tmpSolar.d+1));
        const nl=solarToLunar(next.getUTCFullYear(),next.getUTCMonth()+1,next.getUTCDate());
        if(nl){ly=nl.y;lm=nl.m;ld=nl.d;isLeap=nl.isLeap;}
        else{ly=y;lm=m;ld=d+1;isLeap=false;}
      }else{ly=y;lm=m;ld=d+1;isLeap=false;}
    }else{ly=y;lm=m;ld=d;isLeap=lunarIsLeap;}
  }

  const{stem,branch}=getYearGanZhi(ly);
  chart=buildChartData(ly,lm,ld,h,stem,branch,gender,isLeap);
  chart.birthYear=ly;chart.birthMonth=lm;chart.birthDay=ld;
  chart.yearStemChar=GAN[stem];chart.yearBranchChar=ZHI[branch];
  chart.animal=ANIMALS[branch];chart.hourChar=ZHI[h];
  chart.isYeZi=isYeZi;

  renderChartTab();
  document.getElementById('resultArea').classList.remove('hidden');

  // Update compat self info
  document.getElementById('compatSelf').textContent=
    `${ly}年${MONTHS_CN[lm-1]}月${DAYS_CN[ld-1]} ${ZHI[h]}時 ${gender==='m'?'男':'女'}命`;

  // Init compat palace select
  renderCompatPalaceSelect();
  buildTransits();
}

  });
  return html;

  };
  const key=[...stars].sort().join(',');
  return combos[key]||null;
}

function getPalaceAdvice(idx, palace){
  const names=palace.mainStars;
  const hasSihua=palace.sihua.length>0;
  const hasJi=palace.sihua.some(s=>s.type==='ji');
  const hasLu=palace.sihua.some(s=>s.type==='lu');

  const baseAdvice=[
    '命宮為人生格局之源，主星的吉凶決定一生個性走向，宜了解自身優劣勢加以發揮。',
    '兄弟宮反映手足緣分，主星強則兄弟情深，可得助力；主星弱則手足各自離散。',
    '夫妻宮主婚緣，觀主星性質可知配偶特質，化忌入夫妻宮需注意感情波折。',
    '子女宮主生育緣及下屬運，主星旺則子女孝順賢能，對晚輩管理也有助益。',
    '財帛宮直接主財運，主星與四化共同決定財富的方式與多寡。',
    '疾厄宮需注意身體健康，主星顯示先天體質，有煞星入宮宜定期健檢。',
    '遷移宮主外出貴人運，有吉星則適合出外發展，有煞星宜謹慎出行。',
    '僕役宮主人際與下屬，吉星入宮則下屬忠心，僕役宮弱則人際多變。',
    '官祿宮為事業命脈，主星吉則仕途順遂，宜參考主星特性選擇適合職業。',
    '田宅宮主不動產與家宅，主星旺則祖業豐厚，易有房產收益。',
    '福德宮主精神享受，星曜吉則心靈富足，星曜凶則精神壓力大。',
    '父母宮主長上緣分，吉則得長上照顧，也主文書考試運。',
  ];
  let advice=baseAdvice[idx];
  if(hasLu)advice+=' 今有化祿進駐，此宮運勢旺盛，為發揮的黃金時機。';
  if(hasJi)advice+=' 化忌入宮需特別留心，建議在此宮所代表的事項上多加謹慎。';
  return advice;
}

function getDaXianAdvice(limit, palaces){
  const idx=palaces.findIndex(p=>p.branch===limit.branch);
  if(idx<0)return'大限宮位承接流年的能量，宜把握時機穩步發展。';
  const pm=PALACE_MEANINGS[idx];
  let advice=`本大限行至${limit.palaceName}，十年重心在於「${pm.keywords}」方面。`;
  if(limit.mainStars.length){
    const stars=limit.mainStars;
    advice+=` 宮內有${stars.join('、')}坐守，`;
    if(stars.includes('紫微')||stars.includes('天府'))advice+='格局高，此十年宜積極進取，把握名位機遇。';
    else if(stars.includes('武曲')||stars.includes('太陰'))advice+='財星臨照，此十年財運可期，宜投資理財。';
    else if(stars.includes('太陽')||stars.includes('天機'))advice+='智謀光明，此十年宜拓展人脈，積累名聲。';
    else if(stars.includes('七殺')||stars.includes('破軍'))advice+='多變動，此十年宜勇於開創，但需防衝動。';
    else if(stars.includes('天同')||stars.includes('天梁'))advice+='福蔭加持，此十年較為安穩，可享福祿。';
    else advice+='宜按主星特性發展，循序漸進。';
  }else{
    advice+='本宮無主星，借對宮之力，此十年發展較為含蓄，宜腳踏實地。';
  }
  return advice;
}

function updateQDisplay(){
  const isLunar=document.getElementById('qCalType').value==='lunar';
  const y=+document.getElementById('queryYear').value;
  const m=+document.getElementById('queryMonth').value;
  const d=+document.getElementById('queryDay').value;

  if(!isLunar){

      el.textContent=`農曆：${l.y}（${GAN[stem]}${ZHI[branch]}）${l.isLeap?'閏':''}${MONTHS_CN[l.m-1]}月${DAYS_CN[l.d-1]}`;

}

const SHICHEN=[
  {name:'日子',range:'23:00–00:00',branch:0},
  {name:'夜子',range:'00:00–01:00',branch:0},
  {name:'丑',  range:'01:00–03:00',branch:1},

  {name:'卯',  range:'05:00–07:00',branch:3},

  {name:'巳',  range:'09:00–11:00',branch:5},
  {name:'午',  range:'11:00–13:00',branch:6},
  {name:'未',  range:'13:00–15:00',branch:7},
  {name:'申',  range:'15:00–17:00',branch:8},
  {name:'酉',  range:'17:00–19:00',branch:9},
  {name:'戌',  range:'19:00–21:00',branch:10},

// ── Transit state ────────────────────────────────────────
let tS={lYear:2026,lMonth:1,lDay:1,lunarBranch:0,stem:0,
        selM:null,selD:null,selH:null,focus:'year'};

function mod12(n){return((n%12)+12)%12;} // JS-safe modulo, always 0-11

function pAt(branch){
  if(!chart)return null;
  const b=mod12(branch);
  return chart.palaces.find(x=>x.branch===b)||
    {palaceName:'（空）',branch:b,branchChar:ZHI[b],mainStars:[],auxStars:[],sihua:[],palaceIndex:-1};
}

// 空宮時借對宮 (對宮 = branch+6 mod 12)
function duiGong(p){
  if(!p||!chart)return null;
  if((p.mainStars||[]).length>0)return null; // 非空宮
  return pAt(mod12(p.branch+6));
}

function starsHtml(p){return(p.mainStars||[]).map(s=>`<span class="star main">${s}</span>`).join('')}

function cellHtml(label,sub,branch,selBranch,onclick,extraClass=''){
  const p=pAt(branch);if(!p)return'';
  const isSel=mod12(branch)===mod12(selBranch);
  const dg=duiGong(p); // 對宮借星 (若空宮)
  const starsLine=dg
    ?`<span style="color:var(--text3)">${dg.mainStars.slice(0,2).join('·')}(借)</span>`
    :`${(p.mainStars||[]).slice(0,2).join('·')||''}`;
  const isEmpty=!(p.mainStars||[]).length;
  return`<div class="tcell${isSel?' sel':''}${isEmpty?' empty-gong':''}${extraClass?' '+extraClass:''}" onclick="${onclick}">
    <div class="tl">${label}</div>
    ${sub?`<div style="font-size:9px;color:var(--text3);margin-bottom:1px">${sub}</div>`:''}
    <div class="tn">${p.palaceName}${isEmpty?'<span style="font-size:9px;color:var(--text3)">(空)</span>':''}</div>
    <div class="ts">${p.branchChar} ${starsLine}</div>
  </div>`;
}

// ── Build & Render ───────────────────────────────────────
function buildTransits(){
  if(!chart)return;
  const calType=document.getElementById('qCalType').value;
  const qY=+document.getElementById('queryYear').value;
  const qM=+document.getElementById('queryMonth').value;
  const qD=+document.getElementById('queryDay').value;
  let lYear,lMonth,lDay;
  if(calType==='solar'){
    const l=solarToLunar(qY,qM,qD);
    if(!l){alert('日期超出範圍');return;}
    lYear=l.y;lMonth=l.m;lDay=l.d;
  }else{lYear=qY;lMonth=qM;lDay=qD;}
  const{stem}=getYearGanZhi(lYear);
  const lunarBranch=(lYear-4+1200)%12;
  tS={lYear,lMonth,lDay,lunarBranch,stem,selM:lMonth,selD:lDay,selH:null,focus:'year'};
  renderTransits();
}

function tSelectMonth(m){tS.selM=m;tS.selD=1;tS.selH=null;tS.focus='month';renderTransits();
  setTimeout(()=>document.getElementById('tBlockNian')?.scrollIntoView({behavior:'smooth',block:'nearest'}),60);}
function tSelectDay(d){tS.selD=d;tS.selH=null;tS.focus='day';renderTransits();
  setTimeout(()=>document.getElementById('tBlockYue')?.scrollIntoView({behavior:'smooth',block:'nearest'}),60);}
function tSelectHour(h){tS.selH=h;tS.focus='hour';renderTransits();
  setTimeout(()=>document.getElementById('tBlockRi')?.scrollIntoView({behavior:'smooth',block:'nearest'}),60);}

function renderTransits(){
  if(!chart)return;
  const{lYear,lMonth,lDay,lunarBranch,stem,selM,selD,selH,focus}=tS;
  const qSihua=SIHUA[stem];
  const age=lYear-chart.birthYear;
  const curLimit=chart.limits.find(l=>age>=l.startAge&&age<=l.endAge);
  const xxBranch=getXiaoXian(chart.yearBranch,chart.gender,age);

  const curM=selM||lMonth, curD=selD||lDay;

  const liuNianBr=getLiuNianPos(lunarBranch);
  const liuYueBr =(liuNianBr-curM+1+120)%12;   // +120 防JS負數取模
  const liuRiBr  =(liuYueBr-curD+1+120)%12;    // +120 防d>13時負數
  const liuShiBr =selH!=null?(liuRiBr-SHICHEN[selH].branch+120)%12:null;

  const pDX  =curLimit?pAt(curLimit.branch):null;
  const pXX  =pAt(xxBranch);
  const pNian=pAt(liuNianBr);
  const pYue =pAt(liuYueBr);
  const pRi  =pAt(liuRiBr);
  const pShi =selH!=null?pAt(liuShiBr):null;

  // ─ Summary cards ───────────────────────────────────────
  const mkCard=(ttl,p,sub,active)=>{
    if(!p)return'';
    const border=active?'border:2px solid var(--accent)':'';
    return`<div class="transit-card highlight" style="${border}">
      <h4>${ttl}</h4>
      <div class="tc-main">${p.palaceName}（${p.branchChar}）</div>
      <div class="tc-sub">${starsHtml(p)||'無主星'}</div>
      <div style="font-size:10px;color:var(--text3);margin-top:2px">${sub}</div>
    </div>`;
  };

  let html=`<div style="font-size:13px;font-weight:600;color:var(--accent);margin-bottom:8px">
    ${lYear}年（${GAN[stem]}${ZHI[lunarBranch]}）${MONTHS_CN[curM-1]}月${DAYS_CN[curD-1]} 運勢概覽</div>
  <div class="transit-row">
    ${mkCard('大限',pDX,curLimit?curLimit.startAge+'—'+curLimit.endAge+'歲':age+'歲',false)}
    ${mkCard('小限',pXX,age+'歲',false)}
    ${mkCard('流年命宮',pNian,GAN[stem]+ZHI[lunarBranch]+'年',focus==='year')}
    ${mkCard('流月命宮',pYue,MONTHS_CN[curM-1]+'月',focus==='month')}
    ${mkCard('流日命宮',pRi,DAYS_CN[curD-1],focus==='day')}
    ${pShi?mkCard('流時命宮',pShi,SHICHEN[selH].name+'時 '+SHICHEN[selH].range,focus==='hour'):''}
  </div>`;

  // ─ 四化 ────────────────────────────────────────────────
  html+=`<div class="detail-panel" style="margin:8px 0">
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px">
      <span style="font-size:13px;font-weight:600;color:var(--accent)">${lYear}年流年四化</span>
      <span class="badge badge-jade">祿：${qSihua.lu}</span>
      <span class="badge" style="background:rgba(26,82,118,0.12);color:var(--blue)">權：${qSihua.quan}</span>
      <span class="badge badge-gold">科：${qSihua.ke}</span>
      <span class="badge badge-red">忌：${qSihua.ji}</span>
    </div>
    <div style="font-size:12px;color:var(--text2);line-height:1.9">
      ${buildYearCommentary(pNian,pDX,pXX,qSihua,lYear,age,curLimit)}
    </div>
  </div>`;

  // ═══════════════════════════════════════════════════════
  // 流年 → 十二月格
  // ═══════════════════════════════════════════════════════
  html+=`<div class="tblock" id="tBlockNian">
    <div class="tblock-title">流年十二月 <small>點擊月份展開該月論述</small></div>
    <div class="tgrid">`;
  for(let m=1;m<=12;m++){
    const br=(liuNianBr-m+1+120)%12;
    html+=cellHtml(MONTHS_CN[m-1]+'月','',br,liuYueBr,`tSelectMonth(${m})`);
  }
  html+=`</div>`;

  // ─ 流月論述（選月後顯示）────────────────────────────────
  html+=`<div style="margin-top:10px;padding:10px;background:var(--bg3);border-radius:6px;font-size:12px;color:var(--text2);line-height:1.9">
    <strong style="color:var(--accent)">${MONTHS_CN[curM-1]}月 流月命宮論述</strong><br>
    ${buildMonthCommentary(pYue,pNian,qSihua,curM,lYear)}
  </div>`;
  html+=`</div>`;

  // ═══════════════════════════════════════════════════════
  // 流月 → 三十日格
  // ═══════════════════════════════════════════════════════
  html+=`<div class="tblock" id="tBlockYue">
    <div class="tblock-title">流月逐日（${MONTHS_CN[curM-1]}月）<small>點擊日期展開該日論述</small></div>
    <div class="tgrid tgrid-wide">`;
  for(let d=1;d<=30;d++){
    const br=(liuYueBr-d+1+120)%12;             // +120 防負數
    html+=cellHtml(DAYS_CN[d-1],'',br,liuRiBr,`tSelectDay(${d})`);
  }
  html+=`</div>`;

  // ─ 流日論述（選日後顯示）────────────────────────────────
  html+=`<div style="margin-top:10px;padding:10px;background:var(--bg3);border-radius:6px;font-size:12px;color:var(--text2);line-height:1.9">
    <strong style="color:var(--accent)">${DAYS_CN[curD-1]} 流日命宮論述</strong><br>
    ${buildDayCommentary(pRi,pYue,pNian,curD,curM)}
  </div>`;
  html+=`</div>`;

  // ═══════════════════════════════════════════════════════
  // 流日 → 十三時辰格（含時段）
  // ═══════════════════════════════════════════════════════
  html+=`<div class="tblock" id="tBlockRi">
    <div class="tblock-title">流日時辰（${DAYS_CN[curD-1]}）<small>點擊時辰展開該時論述</small></div>
    <div class="tgrid">`;
  for(let h=0;h<13;h++){
    const sc=SHICHEN[h];
    const timeBr=(liuRiBr-sc.branch+120)%12;
    const isSel=selH===h;
    const tp=pAt(timeBr);
    html+=`<div class="tcell${isSel?' sel':''}" onclick="tSelectHour(${h})" style="cursor:pointer">
      <div class="tl">${sc.name}時</div>
      <div style="font-size:9px;color:var(--text3);margin-bottom:2px">${sc.range}</div>
      <div class="tn">${tp?tp.palaceName:'—'}</div>
      <div class="ts">${tp?tp.branchChar+' '+(tp.mainStars||[]).slice(0,2).join('·'):'—'}</div>
    </div>`;
  }
  html+=`</div>`;

  // ─ 流時論述（選時辰後顯示）──────────────────────────────
  if(selH!=null&&pShi){
    html+=`<div style="margin-top:10px;padding:10px;background:var(--bg3);border-radius:6px;font-size:12px;color:var(--text2);line-height:1.9">
      <strong style="color:var(--accent)">${SHICHEN[selH].name}時（${SHICHEN[selH].range}）流時命宮論述</strong><br>
      ${buildHourCommentary(pShi,pRi,selH)}
    </div>`;
  }else{
    html+=`<div style="margin-top:8px;font-size:11px;color:var(--text3);padding:4px 0">點擊上方任一時辰格查看該時段詳細論述</div>`;
  }
  html+=`</div>`;

  document.getElementById('transitsContent').innerHTML=html;
}

const PM=PALACE_MEANINGS; // shorthand

function palaceStarDesc(p){
  if(!p)return'本宮無主星，借對宮之力。';
  const sd=STAR_DESC;
  return(p.mainStars||[]).map(s=>sd[s]?`<strong>${s}</strong>：${sd[s].main}`:'').filter(Boolean).join(' ');
}

function sihuaInPalace(p,sihua){
  if(!p)return'';
  const SIHUA_SYMBOL={lu:'化祿',quan:'化權',ke:'化科',ji:'化忌'};
  return(p.sihua||[]).map(s=>`<span style="color:${s.type==='ji'?'var(--red)':'var(--jade)'}">${s.star}${SIHUA_SYMBOL[s.type]}</span>`).join('、');
}

function palaceRelation(brA,brB){
  const diff=mod12(Math.abs(mod12(brA)-mod12(brB)));
  if(diff===0)return'同宮';
  if(diff===6)return'對沖';
  if(diff===4||diff===8)return'三合';
  if(diff===3||diff===9)return'拱照';
  return'';
}

function buildYearCommentary(pNian,pDX,pXX,sihua,year,age,curLimit){
  if(!pNian)return'';
  const pm=PM[pNian.palaceIndex]||{theme:'',keywords:''};
  let txt=`${year}年流年命宮落在<strong>${pNian.palaceName}（${pNian.branchChar}宮）</strong>，此宮主管「${pm.theme}」。`;
  const sDesc=palaceStarDesc(pNian);
  if(sDesc)txt+=` 宮中${sDesc}`;
  const sh=sihuaInPalace(pNian,sihua);
  if(sh)txt+=` 本年四化：${sh}入宮，影響顯著。`;
  // 四化落宮
  const luPalace=chart.palaces.find(p2=>(p2.mainStars||[]).includes(sihua.lu));
  const jiPalace=chart.palaces.find(p2=>(p2.mainStars||[]).includes(sihua.ji));
  if(luPalace)txt+=` 化祿${sihua.lu}落在<strong>${luPalace.palaceName}</strong>，此宮事業財緣旺盛。`;
  if(jiPalace)txt+=` 化忌${sihua.ji}落在<strong>${jiPalace.palaceName}</strong>，需特別留意此宮事項。`;
  if(pDX){
    const rel=palaceRelation(pDX.branch,pNian.branch);
    txt+=` 本大限在「${pDX.palaceName}」，`;
    txt+=rel==='同宮'?'大限流年同宮，為十年大運中的高峰年，機遇集中，宜把握。':
         rel==='對沖'?'大限流年對沖，宜防大運格局受流年衝擊，謹慎佈局。':
         rel==='三合'?'大限流年三合，相輔相成，運勢順暢。':'大限為底蘊，流年為主軸，循序而進。';
  }
  if(pXX)txt+=` 小限落在「${pXX.palaceName}」，為今年流年副宮，${PM[pXX.palaceIndex]?.keywords||'宮位'}方面宜多留心。`;
  return txt;
}

function buildMonthCommentary(pYue,pNian,sihua,month,year){
  if(!pYue)return'';
  const pm=PM[pYue.palaceIndex]||{theme:'',keywords:''};
  let txt=`${year}年${MONTHS_CN[month-1]}月，流月命宮落在<strong>${pYue.palaceName}（${pYue.branchChar}宮）</strong>，此宮主掌「${pm.keywords}」。`;
  const sDesc=palaceStarDesc(pYue);
  if(sDesc)txt+=` 宮中${sDesc}`;
  const sh=sihuaInPalace(pYue,sihua);
  if(sh)txt+=` 本宮有流年四化${sh}臨照，影響加重。`;
  const rel=pNian?palaceRelation(pYue.branch,pNian.branch):'';
  if(rel==='同宮')txt+=` 本月流月命宮與流年命宮同宮，年月能量疊加，是本年重要月份。`;
  else if(rel==='對沖')txt+=` 本月流月命宮與流年命宮對沖，宜防月份中的摩擦與阻礙。`;
  else if(rel==='三合')txt+=` 本月流月命宮與流年命宮三合，月份運勢與年運呼應，吉象明顯。`;
  // Star advice
  const stars=pYue.mainStars||[];
  if(stars.includes('紫微')||stars.includes('天府'))txt+=` 本月格局高，宜積極爭取名位機遇。`;
  else if(stars.includes('武曲')||stars.includes('太陰'))txt+=` 本月財運可期，適合理財投資相關決策。`;
  else if(stars.includes('太陽')||stars.includes('天梁'))txt+=` 本月人緣佳，貴人易出現，適合對外拓展。`;
  else if(stars.includes('七殺')||stars.includes('破軍'))txt+=` 本月變動較多，宜勇於開創但需防衝動。`;
  else if(stars.includes('廉貞')||stars.includes('巨門'))txt+=` 本月需防口舌是非，凡事謹言慎行。`;
  else if(stars.includes('天同')||stars.includes('貪狼'))txt+=` 本月適合社交應酬、享受休閒，勿過度懶散。`;
  if(!stars.length)txt+=` 本月宮中無主星，借對宮力量，發展較為平穩，宜按部就班。`;
  txt+=` 建議在${pm.keywords}相關事項上多加關注。`;
  return txt;
}

  let txt=`${MONTHS_CN[month-1]}月${DAYS_CN[day-1]}，流日命宮落在<strong>${pRi.palaceName}（${pRi.branchChar}宮）</strong>，主管「${pm.theme}」。`;
  const sDesc=palaceStarDesc(pRi);
  if(sDesc)txt+=` 宮中${sDesc}`;
  const relY=pNian?palaceRelation(pRi.branch,pNian.branch):'';
  const relM=pYue?palaceRelation(pRi.branch,pYue.branch):'';
  if(relY==='同宮'&&relM==='同宮')txt+=` 今日流日、流月、流年三宮同聚，為本月重要日期，影響力強。`;
  else if(relM==='同宮')txt+=` 今日流日命宮與流月同宮，是本月中的重要日期。`;
  else if(relY==='同宮')txt+=` 今日流日命宮與流年同宮，今日與年度主軸契合。`;
  // Star-based daily advice
  const stars=pRi.mainStars||[];

  else if(stars.includes('天府'))txt+=` 今日財庫穩固，適合簽約、存款、整理財務。`;

  else if(stars.includes('太陰'))txt+=` 今日適合靜態事務、家庭活動、內部整理。`;
  else if(stars.includes('天機'))txt+=` 今日思維活躍，適合規劃、討論、分析，但避免過度善變。`;
  else if(stars.includes('天同'))txt+=` 今日悠閒順遂，適合輕鬆的社交或休息。`;
  else if(stars.includes('廉貞'))txt+=` 今日需防口舌是非，避免爭執，文件細節宜再三確認。`;
  else if(stars.includes('天梁'))txt+=` 今日逢凶化吉，有長輩或貴人護持，醫療健康事宜吉利。`;
  else if(stars.includes('巨門'))txt+=` 今日宜深思熟慮，避免口舌，溝通需耐心。`;
  else if(stars.includes('天相'))txt+=` 今日適合服務、協助他人，辦事得體順利。`;

  else if(stars.includes('破軍'))txt+=` 今日主變動，宜破舊立新，但防破財破耗。`;
  if(!stars.length)txt+=` 今日宮中無主星，借對宮力量，平穩中帶前進。`;

function buildHourCommentary(pShi,pRi,hIdx){
  if(!pShi)return'';
  const sc=SHICHEN[hIdx];
  const pm=PM[pShi.palaceIndex]||{theme:'',keywords:''};
  let txt=`<strong>${sc.name}時（${sc.range}）</strong>，流時命宮落在<strong>${pShi.palaceName}（${pShi.branchChar}宮）</strong>，此時段主管「${pm.theme}」。`;
  // Star advice for this time
  const stars=pShi.mainStars||[];
  const timeAdvice={
    '紫微':'此時段宜把握主動，展現氣勢，適合重要會面或發號施令。',
    '天府':'此時段財氣旺，適合財務決策、簽約、收款。',
    '武曲':'此時段行動力強，適合需要魄力的事務，避免猶豫。',
    '太陽':'此時段光明磊落，適合公開場合、拜訪、對外聯繫。',
    '太陰':'此時段宜靜不宜動，適合內務整理、思考計劃。',
    '天機':'此時段靈感豐富，適合創意工作、分析討論。',
    '天同':'此時段輕鬆愉快，適合休息、飲食、輕鬆社交。',
    '廉貞':'此時段需謹言慎行，避免衝突，文件細節仔細確認。',
    '天梁':'此時段有貴人護持，遇到困難易逢凶化吉。',
    '巨門':'此時段溝通宜耐心，避免誤解，不適合重要談判。',
    '天相':'此時段適合輔助、服務、協調工作，辦事得體。',
    '貪狼':'此時段桃花旺，適合社交、應酬、建立人脈。',
    '七殺':'此時段幹勁十足，適合需要突破的事務，防衝動。',
    '破軍':'此時段主變動，適合處理需要改革的事務。',
  };
  const adv=stars.map(s=>timeAdvice[s]).filter(Boolean);
  if(adv.length)txt+=` ${adv[0]}`;
  else txt+=` 此時段無主星臨宮，運勢平穩，按計劃行事即可。`;
  // Relation with day palace
  const rel=palaceRelation(pShi.branch,pRi.branch);
  if(rel==='同宮')txt+=` 流時與流日同宮，今日此時段為全日最佳時段，能量最為集中。`;
  else if(rel==='三合')txt+=` 流時與流日三合，此時段與今日整體運勢相輔相成。`;
  else if(rel==='對沖')txt+=` 流時與流日對沖，此時段需特別謹慎，避免重要決策。`;
  if(pm.keywords)txt+=` 整體而言，此時段在「${pm.keywords}」方面最為活躍，宜善加利用。`;
  return txt;
}
